<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차례대로 가리켜요</title>
<style>body{font-family:system-ui;background:#f6f8ef;color:#183524;text-align:center;padding:24px}button{font:inherit;font-size:24px;padding:16px;margin:8px;border-radius:12px}#numbers{display:flex;justify-content:center;gap:20px;margin:40px 0}.tile{flex:1;max-width:180px;border:4px solid #496650;border-radius:24px;padding:30px 0;font-size:80px;background:white}.active{background:#ffe483;border-color:#885900}.tile small{display:block;font-size:20px}p{font-size:24px}#dot{position:fixed;width:24px;height:24px;border-radius:50%;background:#d33;pointer-events:none;display:none}</style>
<h1>차례대로 가리켜요</h1><p>숫자 위치가 무작위로 바뀝니다. 1 → 2 → 3 → 4 → 5 순서로 가리켜 주세요.</p>
<button id="connect">UNO 연결</button><button id="calibrate">위치 보정 시작</button><button id="capture" disabled>현재 위치 저장</button><button id="start" disabled>게임 시작</button><button id="stop">멈추기</button>
<p id="status" role="status">UNO 연결 후 1~5의 가리키는 위치를 보정해 주세요.</p><p><b id="stage">1</b>단계 · 점수 <b id="score">0</b> · 남은 시간 <b id="time">15</b>초</p><div id="numbers"></div><div id="dot"></div>
<p>카메라와 의자 위치를 고정해 주세요. 손은 한 사람만 보여 주세요.</p><script type="module" src="app.mjs"></script></html>
