<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차례대로 가리켜요</title>
<style>body{font-family:system-ui;background:#f6f8ef;color:#183524;text-align:center;padding:24px}button{font:inherit;font-size:24px;padding:16px;margin:8px;border-radius:12px}#numbers{position:relative;width:min(1100px,100%);min-width:650px;height:500px;margin:30px auto;border:3px solid #496650;border-radius:20px;background:#edf3e5;overflow:hidden}.tile{position:absolute;transform:translate(-50%,-50%);box-sizing:border-box;width:14%;height:20%;border:4px solid #496650;border-radius:24px;font-size:56px;background:white;display:flex;flex-direction:column;justify-content:center}.tile[hidden]{display:none}#marker{position:absolute;transform:translate(-50%,-50%);background:#ffe483;border:3px solid #885900;padding:12px;font-size:20px}.active{background:#ffe483;border-color:#885900}.tile small{display:block;font-size:20px}p{font-size:24px}#dot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#d33;pointer-events:none}</style>
<h1>차례대로 가리켜요</h1><small>USB 연결 진단 개선 · 버전 5</small><p>숫자 위치가 무작위로 바뀝니다. 1 → 2 → 3 → 4 → 5 순서로 가리켜 주세요.</p>
<button id="connect">UNO 연결</button><button id="disconnect" disabled>UNO 연결 해제</button><button id="calibrate" disabled>위치 보정 시작</button><button id="capture" disabled>현재 위치 저장</button><button id="start" disabled>게임 시작</button><button id="stop">멈추기</button>
<p id="status" role="status">UNO 연결 후 게임 영역의 네 모서리를 보정해 주세요.</p><p id="sensor" role="status">UNO 미연결 · 연결 후 손 좌표와 보정 표본 수가 표시됩니다.</p><p><b id="stage">1</b>단계 · 점수 <b id="score">0</b> · 남은 시간 <b id="time">15</b>초</p><div id="numbers"><div id="marker" hidden></div><div id="dot" hidden></div></div>
<p>카메라와 의자 위치를 고정해 주세요. 손은 한 사람만 보여 주세요.</p><script type="module" src="app.mjs?v=serial-5"></script></html>
